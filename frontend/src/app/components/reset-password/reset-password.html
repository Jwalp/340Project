<div class="auth-page">
  <main class="auth-container">
    <div class="auth-box">
      <button class="back-button" (click)="goBack()" aria-label="Go back">
        <i class="fa-solid fa-arrow-left"></i>
      </button>
      
      <h2>Reset Your Password</h2>
      <p class="auth-subtitle">Enter your new password below</p>
      
      <form class="auth-form" #resetForm="ngForm" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="password">New Password</label>
          <div class="password-input-wrapper" (mouseenter)="showPasswordIcon = true" (mouseleave)="showPasswordIcon = false; showPassword = false">
            <input 
              [type]="showPassword ? 'text' : 'password'" 
              id="password" 
              [(ngModel)]="password" 
              name="password" 
              required 
              minlength="8"
              (focus)="showPasswordRequirements = true"
              [disabled]="isSubmitting"
              #passwordInput="ngModel">
            <button 
              *ngIf="showPasswordIcon && password.length > 0"
              type="button" 
              class="toggle-password" 
              (mousedown)="showPassword = true"
              (mouseup)="showPassword = false"
              (mouseleave)="showPassword = false"
              (touchstart)="showPassword = true"
              (touchend)="showPassword = false"
              tabindex="-1"
              aria-label="Show password">
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>
          <div class="password-requirements" *ngIf="showPasswordRequirements && (password.length < 8 || !hasNumber() || !hasUpperCase() || !hasLowerCase())">
            <p class="requirements-title">Password must contain:</p>
            <ul>
              <li [class.valid]="password.length >= 8">✓ At least 8 characters</li>
              <li [class.valid]="hasUpperCase()">✓ One uppercase letter</li>
              <li [class.valid]="hasLowerCase()">✓ One lowercase letter</li>
              <li [class.valid]="hasNumber()">✓ One number</li>
            </ul>
          </div>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm New Password</label>
          <div class="password-input-wrapper" (mouseenter)="showConfirmPasswordIcon = true" (mouseleave)="showConfirmPasswordIcon = false; showConfirmPassword = false">
            <input 
              [type]="showConfirmPassword ? 'text' : 'password'" 
              id="confirmPassword" 
              [(ngModel)]="confirmPassword" 
              name="confirmPassword" 
              required
              [disabled]="isSubmitting"
              #confirmPasswordInput="ngModel">
            <button 
              *ngIf="showConfirmPasswordIcon && confirmPassword.length > 0"
              type="button" 
              class="toggle-password" 
              (mousedown)="showConfirmPassword = true"
              (mouseup)="showConfirmPassword = false"
              (mouseleave)="showConfirmPassword = false"
              (touchstart)="showConfirmPassword = true"
              (touchend)="showConfirmPassword = false"
              tabindex="-1"
              aria-label="Show password">
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>
          <div class="validation-message" *ngIf="password !== confirmPassword && confirmPasswordInput.touched">
            Passwords do not match
          </div>
        </div>

        <div *ngIf="errorMessage" class="error-message">
          <i class="fa-solid fa-circle-exclamation"></i>
          {{ errorMessage }}
        </div>

        <div *ngIf="successMessage" class="success-message">
          <i class="fa-solid fa-circle-check"></i>
          {{ successMessage }}
        </div>

        <button 
          type="submit" 
          class="btn-primary btn-full" 
          [disabled]="isSubmitting || resetForm.invalid || password !== confirmPassword || !isPasswordValid()">
          <span *ngIf="!isSubmitting">Reset Password</span>
          <span *ngIf="isSubmitting">
            <i class="fa-solid fa-spinner fa-spin"></i> Resetting...
          </span>
        </button>

        <p class="auth-link">
          Remember your password? <a routerLink="/login">Back to login</a>
        </p>
      </form>
    </div>
  </main>
</div>
